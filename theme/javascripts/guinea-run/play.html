<!doctype html>
<!--
  Guinea Run on its own, for the VS Code extension: its Guinea Run panel shows
  this page in a frame, so the game is fetched only when someone opens it and
  the extension ships nothing of it.

    play.html?lang=fr&from=vscode

  The page that holds the frame hears, through postMessage, { source:
  "guinea-run", type: "exit" } when the player closes the game, and { type:
  "openExternal", url } for each link: in a frame a lab link would otherwise
  replace the game. Opened on its own, the game plays the same.

    play.html?lang=fr&from=vscode&save=host

  With save=host, the page that holds the frame keeps the save every VS Code
  project shares: the game asks for it ({ type: "loadSave" }, answered by {
  source: "vscode-sfdx-hardis", type: "save", blob }) before it starts, then
  sends { type: "storeSave", blob } after each change and { type: "clearSave"
  } when the save was edited by hand. See core/host-save.js.

  Once opened online, it plays offline too: sw.js keeps a copy of the game.
  On a phone it can be added to the home screen (manifest.webmanifest), and
  opens from its icon (?from=app) without a network.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guinea Run</title>
    <!-- A share of this page shows the course card, like every other page of the site -->
    <meta property="og:title" content="Guinea Run">
    <meta property="og:image" content="https://sfdx-hardis-training.cloudity.com/_assets/social/course.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- The home screen app -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="theme-color" content="#032d60">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Guinea Run">
    <style>
      @font-face {
        font-family: "Open Sans";
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url("../../stylesheets/fonts/open-sans-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("../../stylesheets/fonts/jetbrains-mono-latin.woff2") format("woff2");
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #032d60;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { createInstallOffer } from "./core/install.js";
      import { hostSaveWanted, restoreFromHost } from "./core/host-save.js";

      const params = new URLSearchParams(location.search);
      // The home screen app has no lang in its address: the phone's language then
      const asked = params.get("lang") || (navigator.language || "").slice(0, 2);
      const lang = asked === "fr" ? "fr" : "en";
      const framed = window.parent !== window;
      const app = params.get("from") === "app" || (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches) || navigator.standalone === true;
      document.documentElement.lang = lang;

      // Android browsers offer to install the page: kept for the install buttons of the map and the end card
      let storage = null;
      try {
        storage = window.localStorage;
      } catch {
        // Blocked storage: the offer is not remembered
      }
      const install = createInstallOffer({ storage, isApp: app, notify: () => window.dispatchEvent(new Event("guinea-run-install")) });
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        install.promptArrived(event);
      });
      window.addEventListener("appinstalled", () => install.installedNow());
      // Chrome on Android lists the game when it is on the home screen (related_applications of the manifest)
      if (!framed && !app && navigator.getInstalledRelatedApps) {
        navigator
          .getInstalledRelatedApps()
          .then((apps) => install.relatedApps(apps.filter((one) => one.platform === "webapp")))
          .catch(() => {});
      }

      function tell(message) {
        if (framed) {
          window.parent.postMessage(Object.assign({ source: "guinea-run" }, message), "*");
        }
      }

      document.addEventListener(
        "click",
        (event) => {
          const link = event.target.closest && event.target.closest("a[href]");
          if (link && framed && /^https?:/.test(link.href)) {
            event.preventDefault();
            tell({ type: "openExternal", url: link.href });
          }
        },
        true
      );

      const base = new URL("./", location.href).href;
      // In VS Code, the save every project shares is put into this frame's storage before the game reads it
      const [game, hostSave] = await Promise.all([
        import(base + "game.js"),
        hostSaveWanted(params, framed) ? restoreFromHost() : Promise.resolve({ enabled: false, refused: false })
      ]);
      game.start({
        lang,
        trigger: params.get("from") === "vscode" ? "vscode" : app ? "app" : "embed",
        base,
        track: () => {},
        install: framed || app ? null : install,
        hostSave: hostSave.enabled,
        saveRefused: hostSave.refused,
        onExit: () => {
          tell({ type: "exit" });
          if (framed) {
            return;
          }
          if (app) {
            // No course to go back to from the home screen, offline even less: the map again
            location.reload();
          } else {
            location.href = new URL("../../../" + (lang === "fr" ? "fr/" : "en/"), location.href).href;
          }
        }
      });
      tell({ type: "ready" });
      keepOffline(params.get("guinea-offline"));

      /*
       * The service worker (sw.js) keeps a copy of the game, so this page plays
       * offline once opened online. Registered when the game is ready and the
       * browser is idle. Off on a local copy (the fast loop copies files into it)
       * unless ?guinea-offline=1; ?guinea-offline=0 removes it and its copies.
       */
      function keepOffline(setting) {
        try {
          if (!("serviceWorker" in navigator)) {
            return;
          }
          if (setting === "0") {
            navigator.serviceWorker
              .getRegistrations()
              .then((registrations) => Promise.all(registrations.filter((r) => r.scope === base).map((r) => r.unregister())))
              .then(() => caches.keys())
              .then((names) => Promise.all(names.filter((name) => name.startsWith("guinea-run-")).map((name) => caches.delete(name))))
              .catch(() => {});
            return;
          }
          const local = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
          if (local && setting !== "1") {
            return;
          }
          const register = () => navigator.serviceWorker.register(base + "sw.js", { scope: base }).catch(() => {});
          if ("requestIdleCallback" in window) {
            requestIdleCallback(register, { timeout: 5000 });
          } else {
            setTimeout(register, 2000);
          }
        } catch {
          // A frame or a browser that refuses service workers: the game plays online, as before
        }
      }
    </script>
  </body>
</html>
